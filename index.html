<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>⚔️ Fighter RPG</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700;900&family=Rajdhani:wght@400;600;700&display=swap');
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;user-select:none}
:root{
  --bg:#080c14;--surface:#0f1420;--s2:#161c2e;--border:#1e2540;
  --gold:#f0c040;--gold2:#c8960c;--red:#e84040;--blue:#4488ff;
  --green:#40c070;--purple:#a040e0;--cyan:#30d0e8;
  --text:#d8dff0;--muted:#5a6080;
}
html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:'Rajdhani',sans-serif}
canvas{position:fixed;top:0;left:0;width:100%;height:100%;z-index:0}

/* ── TOP LEFT ── */
#top-left{position:fixed;top:10px;left:10px;z-index:20;display:flex;flex-direction:column;gap:4px}
.tchip{font-size:11px;padding:3px 10px;border-radius:20px;border:1px solid var(--border);background:rgba(0,0,0,.78);backdrop-filter:blur(4px);font-weight:600}
#race-chip{display:none;font-family:'Cinzel',serif;font-weight:700;font-size:11px}
#state-chip{display:none;border-color:var(--gold);color:var(--gold)}

/* ── SKILL AREA TOP RIGHT ── */
#skill-area{position:fixed;top:10px;right:10px;z-index:20;display:flex;flex-direction:column;gap:5px;max-height:calc(100vh - 160px);overflow-y:auto;padding-right:2px}
.skill-btn{
  width:66px;height:60px;border-radius:10px;
  background:rgba(8,12,24,.92);border:1.5px solid var(--border);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  cursor:pointer;color:var(--text);font-family:'Rajdhani',sans-serif;
  font-size:10px;font-weight:700;gap:2px;
  backdrop-filter:blur(6px);transition:transform .08s;
  box-shadow:0 2px 12px rgba(0,0,0,.5);
}
.skill-btn:active{transform:scale(.9)}
.skill-btn.locked{opacity:.35;pointer-events:none;filter:grayscale(1)}
.skill-btn.on-cd{pointer-events:none}
.sk-icon{font-size:22px;line-height:1}
.sk-name{font-size:10px;color:var(--muted);line-height:1}
.sk-cd{font-size:9px;color:var(--gold);display:none;position:absolute;top:4px;right:6px}
.skill-btn.s-red{border-color:#e84040;box-shadow:0 0 14px rgba(232,64,64,.4)}
.skill-btn.s-purple{border-color:var(--purple);box-shadow:0 0 12px rgba(160,64,224,.3)}
.skill-btn .lock-overlay{position:absolute;font-size:9px;bottom:3px;color:var(--muted)}

/* ── BOTTOM HUD ── */
#bottom-hud{
  position:fixed;bottom:0;left:0;right:0;z-index:20;
  background:rgba(5,8,16,.97);border-top:1px solid var(--border);
  backdrop-filter:blur(8px);padding:5px 8px 7px;display:flex;flex-direction:column;gap:4px
}
.hud-bars{display:flex;gap:7px;align-items:center}
.blabel{font-size:11px;font-weight:700;min-width:18px;text-align:right}
.bar-bg{flex:1;height:13px;background:rgba(0,0,0,.7);border:1px solid var(--border);border-radius:7px;overflow:hidden;position:relative}
.bar-fill{height:100%;border-radius:7px;transition:width .2s}
.bar-txt{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:700;color:rgba(255,255,255,.85)}
.hp-fill{background:linear-gradient(90deg,#7a1010,#e84040,#ff5555)}
.xp-fill{background:linear-gradient(90deg,#604000,#f0c040)}
.chips{display:flex;align-items:center;gap:5px;flex-shrink:0}
.chip{padding:2px 7px;border-radius:20px;background:rgba(255,255,255,.05);border:1px solid var(--border);font-size:12px;font-weight:700;display:flex;align-items:center;gap:3px}
.chip.lv{border-color:var(--gold);color:var(--gold);font-family:'Cinzel',serif;font-size:13px}
.hud-menu{display:flex;gap:4px}
.mbtn{flex:1;max-width:100px;padding:5px 3px;border-radius:7px;border:1px solid var(--border);background:rgba(255,255,255,.03);color:var(--text);font-family:'Rajdhani',sans-serif;font-size:11px;font-weight:700;cursor:pointer;text-align:center;display:flex;flex-direction:column;align-items:center;gap:1px;transition:all .15s}
.mbtn:active{transform:scale(.95)}
.mbtn.locked{opacity:.3;pointer-events:none;filter:grayscale(1)}
.mbtn .micon{font-size:15px}
.mbtn .mlabel{font-size:10px;color:var(--muted)}

/* ── MODALS ── */
.modal{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.88);backdrop-filter:blur(5px);display:flex;align-items:center;justify-content:center;padding:8px}
.modal.hidden{display:none}
.mbox{background:var(--surface);border:1px solid var(--border);border-radius:14px;width:100%;max-width:500px;max-height:86vh;display:flex;flex-direction:column;overflow:hidden}.mbox-body{padding:12px 14px 14px;overflow-y:auto;flex:1}
.mhdr{display:flex;align-items:center;justify-content:space-between;padding:11px 14px 10px;flex-shrink:0;border-bottom:1px solid var(--border);background:var(--surface);border-radius:14px 14px 0 0}
.mtitle{font-family:'Cinzel',serif;font-size:15px;font-weight:900;color:var(--gold)}
.xbtn{background:none;border:none;color:var(--muted);font-size:20px;cursor:pointer}
.card{background:var(--s2);border:1px solid var(--border);border-radius:10px;padding:11px;margin-bottom:8px}
.card h3{font-size:13px;font-weight:700;margin-bottom:3px}
.card p{font-size:11px;color:var(--muted);line-height:1.5}
.crow{display:flex;align-items:center;justify-content:space-between;margin-top:7px;gap:6px}
.abtn{padding:5px 13px;border-radius:6px;border:none;font-family:'Rajdhani',sans-serif;font-weight:700;font-size:12px;cursor:pointer;transition:transform .1s}
.abtn:active{transform:scale(.95)}
.abtn.gold{background:var(--gold2);color:#000}
.abtn.blue{background:var(--blue);color:#fff}
.abtn.cyan{background:var(--cyan);color:#000}
.abtn.eq{background:transparent;border:1px solid var(--green);color:var(--green)}
.abtn.eqd{background:var(--green);color:#000}
.abtn:disabled{background:var(--border)!important;color:var(--muted)!important;cursor:not-allowed;border:none!important}
.pip-row{display:flex;gap:3px;margin:5px 0}
.pip{width:20px;height:5px;border-radius:3px;background:var(--border)}
.pip.on{background:var(--gold)}
.stbl{width:100%;font-size:12px;border-collapse:collapse}
.stbl td{padding:5px 8px;border-bottom:1px solid var(--border)}
.stbl td:last-child{text-align:right;font-weight:700}
.spc{display:flex;align-items:center;gap:4px}
.sctrl{width:28px;height:28px;border-radius:5px;border:1px solid var(--border);background:rgba(255,255,255,.06);color:var(--text);cursor:pointer;font-size:13px;display:flex;align-items:center;justify-content:center}
.sctrl:active{transform:scale(.9)}

/* Quest */
.quest-item{background:var(--s2);border:1px solid var(--border);border-radius:10px;padding:11px;margin-bottom:8px;position:relative;overflow:hidden}
.quest-item.done{border-color:var(--gold);background:rgba(240,192,64,.06)}
.quest-item h3{font-size:13px;font-weight:700;margin-bottom:3px}
.quest-item p{font-size:11px;color:var(--muted)}
.quest-prog-bg{width:100%;height:5px;background:var(--border);border-radius:3px;margin-top:7px;overflow:hidden}
.quest-prog-fill{height:100%;background:linear-gradient(90deg,var(--gold2),var(--gold));border-radius:3px;transition:width .3s}
.quest-reward{font-size:11px;color:var(--cyan);margin-top:5px}
.quest-claim{padding:5px 14px;border-radius:6px;border:none;background:var(--gold);color:#000;font-family:'Rajdhani',sans-serif;font-weight:700;font-size:12px;cursor:pointer;margin-top:7px}

/* Race result */
#race-result{position:fixed;inset:0;z-index:90;background:rgba(0,0,0,.93);display:flex;align-items:center;justify-content:center;flex-direction:column;gap:10px}
#race-result.hidden{display:none}
.rr-card{border:2px solid;border-radius:18px;padding:22px 28px;text-align:center;min-width:260px;background:rgba(12,16,32,.97)}
.rr-name{font-family:'Cinzel',serif;font-size:26px;font-weight:900;margin-bottom:4px}
.rr-rar{font-size:13px;font-weight:700;margin-bottom:10px;letter-spacing:.1em}
.rr-desc{font-size:13px;color:var(--text);line-height:1.8;margin-bottom:14px;text-align:left}
.rr-btns{display:flex;gap:10px;justify-content:center}
.rr-keep{padding:9px 22px;border-radius:8px;border:none;font-family:'Cinzel',serif;font-weight:700;font-size:13px;cursor:pointer}
.rr-skip{padding:9px 22px;border-radius:8px;border:1px solid var(--border);background:transparent;color:var(--muted);font-family:'Rajdhani',sans-serif;font-weight:600;font-size:13px;cursor:pointer}

/* Notif */
#nstack{position:fixed;top:40%;left:50%;transform:translate(-50%,-50%);z-index:80;display:flex;flex-direction:column;gap:5px;align-items:center;pointer-events:none}
.nitem{background:rgba(8,12,24,.97);border:1px solid;border-radius:10px;padding:8px 16px;font-size:13px;font-weight:700;animation:nIn .3s ease,nOut .4s ease 2.1s forwards;white-space:nowrap;text-align:center;max-width:92vw;word-break:break-all}
@keyframes nIn{from{opacity:0;transform:scale(.8)}to{opacity:1;transform:scale(1)}}
@keyframes nOut{to{opacity:0;transform:scale(.85)}}
.fdmg{position:fixed;font-weight:900;pointer-events:none;z-index:30;font-family:'Rajdhani',sans-serif;animation:fd 1s ease forwards}
@keyframes fd{0%{opacity:1;transform:translateY(0) scale(1)}100%{opacity:0;transform:translateY(-65px) scale(.75)}}

/* Autosave badge */
#save-badge{position:fixed;bottom:150px;left:10px;z-index:20;font-size:10px;color:var(--muted);background:rgba(0,0,0,.6);padding:2px 8px;border-radius:20px;border:1px solid var(--border);opacity:0;transition:opacity .5s}
#save-badge.show{opacity:1}
</style>
</head>
<body>
<canvas id="c"></canvas>
<audio id="lvup-sfx" preload="auto">
  <!-- GitHubのURLを差し替えてください: https://raw.githubusercontent.com/YOUR_USERNAME/YOUR_REPO/main/sunovia-level-up-289723.mp3 -->
  <source src="https://raw.githubusercontent.com/YOUR_USERNAME/YOUR_REPO/main/sunovia-level-up-289723.mp3" type="audio/mpeg">
</audio>

<div id="top-left">
  <div class="tchip" id="kill-chip" style="color:var(--muted)">💀 0</div>
  <div class="tchip" id="race-chip"></div>
  <div class="tchip" id="state-chip"></div>
</div>

<div id="skill-area">
  <!-- 常時表示 -->
  <button class="skill-btn s-red" id="sk-attack" onclick="doAttack()">
    <span class="sk-icon">⚔️</span>
    <span class="sk-name">攻撃</span>
    <span class="sk-cd" id="cd-attack"></span>
  </button>
  <button class="skill-btn s-purple locked" id="sk-crit" onclick="doCritSkill()">
    <span class="sk-icon">✨</span>
    <span class="sk-name">クリ確定</span>
    <span class="sk-cd" id="cd-crit"></span>
    <span class="lock-overlay" id="crit-lock-txt">🔒 クエスト</span>
  </button>
  <!-- 乱闘系スキル -->
  <button class="skill-btn brawl-skill locked" id="sk-burst" onclick="doBurstSkill()" style="border-color:#ff6400;box-shadow:0 0 12px rgba(255,100,0,.3)">
    <span class="sk-icon">🔥</span><span class="sk-name">爆発拳</span>
    <span class="sk-cd" id="cd-burst"></span>
    <span class="lock-overlay" id="burst-lock-txt">🔒</span>
  </button>
  <button class="skill-btn brawl-skill locked" id="sk-rageSkin" onclick="doRageSkin()" style="border-color:#e84040;box-shadow:0 0 12px rgba(232,64,64,.3)">
    <span class="sk-icon">😤</span><span class="sk-name">怒り装甲</span>
    <span class="sk-cd" id="cd-rageSkin"></span>
    <span class="lock-overlay" id="rageSkin-lock-txt">🔒</span>
  </button>
  <button class="skill-btn brawl-skill locked" id="sk-ironBody" onclick="doIronBody()" style="border-color:#aaaacc;box-shadow:0 0 12px rgba(170,170,204,.3)">
    <span class="sk-icon">🛡️</span><span class="sk-name">鋼体</span>
    <span class="sk-cd" id="cd-ironBody"></span>
    <span class="lock-overlay" id="ironBody-lock-txt">🔒</span>
  </button>
  <button class="skill-btn brawl-skill locked" id="sk-dragonPunch" onclick="doDragonPunch()" style="border-color:#f0c040;box-shadow:0 0 12px rgba(240,192,64,.3)">
    <span class="sk-icon">🐉</span><span class="sk-name">龍撃</span>
    <span class="sk-cd" id="cd-dragonPunch"></span>
    <span class="lock-overlay" id="dragonPunch-lock-txt">🔒</span>
  </button>
  <button class="skill-btn brawl-skill locked" id="sk-soulEat" onclick="doSoulEat()" style="border-color:#a040e0;box-shadow:0 0 12px rgba(160,64,224,.3)">
    <span class="sk-icon">💀</span><span class="sk-name">魂喰らい</span>
    <span class="sk-cd" id="cd-soulEat"></span>
    <span class="lock-overlay" id="soulEat-lock-txt">🔒</span>
  </button>
  <!-- 剣系スキル -->
  <button class="skill-btn sword-skill locked" id="sk-blade" onclick="doBladeSkill()" style="border-color:#4488ff;box-shadow:0 0 12px rgba(68,136,255,.3)">
    <span class="sk-icon">🗡️</span><span class="sk-name">五連撃</span>
    <span class="sk-cd" id="cd-blade"></span>
    <span class="lock-overlay" id="blade-lock-txt">🔒</span>
  </button>
  <button class="skill-btn sword-skill locked" id="sk-pierceFang" onclick="doPierceFang()" style="border-color:#30d0e8;box-shadow:0 0 12px rgba(48,208,232,.3)">
    <span class="sk-icon">🔱</span><span class="sk-name">貫通突き</span>
    <span class="sk-cd" id="cd-pierceFang"></span>
    <span class="lock-overlay" id="pierceFang-lock-txt">🔒</span>
  </button>
  <button class="skill-btn sword-skill locked" id="sk-whirlwind" onclick="doWhirlwind()" style="border-color:#40c070;box-shadow:0 0 12px rgba(64,192,112,.3)">
    <span class="sk-icon">🌪️</span><span class="sk-name">旋風斬り</span>
    <span class="sk-cd" id="cd-whirlwind"></span>
    <span class="lock-overlay" id="whirlwind-lock-txt">🔒</span>
  </button>
  <button class="skill-btn sword-skill locked" id="sk-thunderSlash" onclick="doThunderSlash()" style="border-color:#ffe040;box-shadow:0 0 12px rgba(255,224,64,.3)">
    <span class="sk-icon">⚡</span><span class="sk-name">雷光斬り</span>
    <span class="sk-cd" id="cd-thunderSlash"></span>
    <span class="lock-overlay" id="thunderSlash-lock-txt">🔒</span>
  </button>
  <button class="skill-btn sword-skill locked" id="sk-soulBlade" onclick="doSoulBlade()" style="border-color:#f0c040;box-shadow:0 0 16px rgba(240,192,64,.5)">
    <span class="sk-icon">🌟</span><span class="sk-name">魂剣</span>
    <span class="sk-cd" id="cd-soulBlade"></span>
    <span class="lock-overlay" id="soulBlade-lock-txt">🔒</span>
  </button>
</div>

<div id="bottom-hud">
  <div class="hud-bars">
    <span class="blabel" style="color:var(--red)">HP</span>
    <div class="bar-bg" style="flex:2.5">
      <div class="bar-fill hp-fill" id="hp-bar" style="width:100%"></div>
      <div class="bar-txt" id="hp-txt">100/100</div>
    </div>
    <span class="blabel" style="color:var(--gold)">EXP</span>
    <div class="bar-bg" style="flex:1.5">
      <div class="bar-fill xp-fill" id="xp-bar" style="width:0%"></div>
      <div class="bar-txt" id="xp-txt">0/100</div>
    </div>
    <div class="chips">
      <div class="chip lv" id="lv-chip">Lv.1</div>
      <div class="chip" style="color:var(--gold)">💰<span id="coin-txt">0</span></div>
      <div class="chip" style="color:var(--cyan)">🏰<span id="dt-txt">0</span></div>
      <div class="chip" style="color:var(--purple)">💎<span id="ct-txt">0</span></div>
    </div>
  </div>
  <div class="hud-menu">
    <button class="mbtn" onclick="openModal('status-modal')">
      <span class="micon">📊</span><span class="mlabel">ステータス</span>
    </button>
    <button class="mbtn" id="mbtn-inv" onclick="openModal('inventory-modal')">
      <span class="micon">🎒</span><span class="mlabel">インベントリ</span>
    </button>
    <button class="mbtn" id="mbtn-shop" onclick="openModal('store-modal')">
      <span class="micon">🏪</span><span class="mlabel">ショップ</span>
    </button>
    <button class="mbtn locked" id="mbtn-upg" onclick="openModal('upgrade-modal')">
      <span class="micon">⬆️</span><span class="mlabel">強化</span>
    </button>
    <button class="mbtn" id="mbtn-dng" onclick="openModal('dungeon-modal')">
      <span class="micon">🏰</span><span class="mlabel">ダンジョン</span>
    </button>
    <button class="mbtn" id="mbtn-race" onclick="openModal('race-modal')">
      <span class="micon">🎲</span><span class="mlabel">種族</span>
    </button>
    <button class="mbtn" onclick="openModal('quest-modal')">
      <span class="micon">📜</span><span class="mlabel">クエスト<span id="quest-badge"></span></span>
    </button>
  </div>
</div>

<!-- Modals -->
<div class="modal hidden" id="status-modal">
  <div class="mbox"><div class="mhdr"><div class="mtitle">📊 ステータス</div><button class="xbtn" onclick="closeModal('status-modal')">✕</button></div><div class="mbox-body"><div id="status-content"></div></div></div>
</div>
<div class="modal hidden" id="inventory-modal">
  <div class="mbox"><div class="mhdr"><div class="mtitle">🎒 インベントリ</div><button class="xbtn" onclick="closeModal('inventory-modal')">✕</button></div><div class="mbox-body"><div id="inventory-content"></div></div></div>
</div>
<div class="modal hidden" id="store-modal">
  <div class="mbox"><div class="mhdr"><div class="mtitle">🏪 ショップ</div><button class="xbtn" onclick="closeModal('store-modal')">✕</button></div><div class="mbox-body"><div id="store-content"></div></div></div>
</div>
<div class="modal hidden" id="upgrade-modal">
  <div class="mbox"><div class="mhdr"><div class="mtitle">⬆️ 強化</div><button class="xbtn" onclick="closeModal('upgrade-modal')">✕</button></div><div class="mbox-body">
    <div style="font-size:11px;color:var(--cyan);margin-bottom:8px">🏰ダンジョントークン / 💎クリスタルトークンで強化</div>
    <div id="upgrade-content"></div>
  </div></div>
</div>
<div class="modal hidden" id="dungeon-modal">
  <div class="mbox"><div class="mhdr"><div class="mtitle">🏰 ダンジョン</div><button class="xbtn" onclick="closeModal('dungeon-modal')">✕</button></div><div class="mbox-body">
    <div class="card">
      <h3 style="color:var(--gold)">🏰 ダンジョン</h3>
      <p>5ウェーブを倒せ！クリアで🏰トークン×3。<br>解放条件: Lv.30</p>
      <div class="crow"><span style="font-size:12px;color:var(--gold)">🏰<span id="d-owned">0</span></span><button class="abtn gold" onclick="startDungeon()">挑戦</button></div>
    </div>
    <div class="card">
      <h3 style="color:var(--cyan)">💎 クリスタルディフェンス</h3>
      <p>強敵を倒しきれ！クリアで💎トークン×3。<br>解放条件: Lv.50</p>
      <div class="crow"><span style="font-size:12px;color:var(--purple)">💎<span id="c-owned">0</span></span><button class="abtn cyan" onclick="startCrystal()">挑戦</button></div>
    </div>
  </div></div>
</div>
<div class="modal hidden" id="race-modal">
  <div class="mbox"><div class="mhdr"><div class="mtitle">🎲 種族ガチャ</div><button class="xbtn" onclick="closeModal('race-modal')">✕</button></div><div class="mbox-body">
    <div class="card" style="text-align:center;margin-bottom:10px">
      <p style="margin-bottom:4px;font-size:12px;color:var(--muted)">1回 💰500 / 10回 💰5,000 / 100回 💰50,000</p>
      <p style="margin-bottom:8px;font-size:11px;color:var(--cyan)" id="pity-display"></p>
      <div style="display:flex;gap:8px;justify-content:center;flex-wrap:wrap">
        <button class="abtn gold" style="font-size:13px;padding:7px 16px" onclick="doRaceRoll(1)">💰500<br><span style="font-size:10px">×1</span></button>
        <button class="abtn gold" style="font-size:13px;padding:7px 16px" onclick="doRaceRoll(10)">💰5,000<br><span style="font-size:10px">×10</span></button>
        <button class="abtn gold" style="font-size:13px;padding:7px 16px" onclick="doRaceRoll(100)">💰50,000<br><span style="font-size:10px">×100</span></button>
      </div>
    </div>
    <div id="race-list"></div>
  </div></div>
</div>
<div class="modal hidden" id="quest-modal">
  <div class="mbox"><div class="mhdr"><div class="mtitle">📜 クエスト</div><button class="xbtn" onclick="closeModal('quest-modal')">✕</button></div><div class="mbox-body">
    <div id="quest-content"></div>
  </div></div>
</div>

const CDMAP = {
  crit:8000,
  // 乱闘系
  burst:12000, rageSkin:20000, ironBody:18000, dragonPunch:25000, soulEat:30000,
  // 剣系
  blade:15000, pierceFang:10000, whirlwind:20000, thunderSlash:22000, soulBlade:35000,
};
const cdEnd = {};

// スキルCD短縮を適用
function getSkillCd(key){
  const base=CDMAP[key];
  const pct=Math.min(0.75,(G.upgrades.skillCd||0)*0.05);
  return Math.floor(base*(1-pct));
}

// ============================================================
// COMPUTED STATS
// ============================================================
function computeStats() {
  const r    = G.race ? RACES.find(x=>x.id===G.race) : null;
  const b    = r?.buffs || {};
  const w    = WEAPONS.find(x=>x.id===G.equippedWeapon) || WEAPONS[0];
  const isSw = G.equippedWeapon !== 'brawl' && !w.brawlMode;
  const wb   = w.bonus || {};  // 乱闘モードの武器ボーナス

  // ステータスポイントを振るほど大幅に強くなる
  const brawlBonus = G.brawlStat * (isSw ? 1.5 : 5);
  const swordBonus = G.swordStat * (isSw ? 5 : 0.5);
  const statBonus  = brawlBonus + swordBonus;
  const baseDmg    = w.baseDmg + statBonus;

  // ATK%: from upgrades, race bonus, permanent atkPercent, and brawl weapon bonus
  const atkPct = (G.upgrades.dmg * 10) + (b.atkPctBonus||0) + G.atkPercent + (wb.atkPct||0);

  // Final ATK = baseDmg × (1 + atkPct/100)
  const atk = baseDmg * (1 + atkPct / 100);

  return {
    baseDmg:   Math.floor(baseDmg),
    atkPct,
    atk,
    critRate:  5  + G.upgrades.critRate*5  + (b.critRateBonus||0) + (wb.critRate||0),
    critDmg:   150 + G.upgrades.critDmg*20 + (b.critDmgBonus||0) + (wb.critDmg||0),
    luck:      1  + G.upgrades.luck,
    hpMax:     100 + (b.hpBonus||0) + (G.hpStat||0)*10,
    defMul:    (b.defMul||1) + (wb.defMul||0),
    lifesteal: b.lifesteal||0,
    cd:        Math.max(100, 600 - (b.cdReduce||0) - (wb.cdReduce||0) - (G.upgrades.atkCd||0)*30),
  };
}

// ── Spawn enemy ──
function spawnEnemy(){
  const lv  = G.level;
  const mul = G.gameMode==='dungeon' ? 1+G.dungeonWave*.4 : G.gameMode==='crystal' ? 2.5 : 1;
  // Scale HP and ATK harder with level
  const milestone=getEnemyMilestoneMultiplier(lv);
  const isBoss=(lv>0 && lv%20===0);
  const hp  = Math.floor((3 + lv*0.5) * mul * milestone);
  const atk = Math.max(1, Math.floor((1 + lv*0.15) * mul * milestone));
  const coin= Math.floor((10 + lv*5 + Math.random()*lv*3) * mul * milestone);
  const xpTierBonus = Math.pow(2.0, Math.floor(lv/20)); // tier毎に2倍
  const xp  = Math.floor((800 + lv*300) * mul * xpTierBonus);
  enemies.push({
    x:W-110, y:0, w:30, h:58,
    hp, hpMax:hp, atk, anim:0,
    hitFlash:0, dead:false, deathT:0,
    atkTimer:0, atkCd:1800+Math.random()*700,
    coin, xp,
  });
}

// ── Particles ──
function burst(x,y,col,n=10){
  for(let i=0;i<n;i++){
    const a=Math.random()*Math.PI*2, s=1.5+Math.random()*4;
    particles.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-2,r:2+Math.random()*3,color:col,life:35+Math.random()*20,maxLife:55});
  }
}

// ── Float damage text ──
function fdmg(x,y,text,col,sz=18){
  const el=document.createElement('div');
  el.className='fdmg';
  el.textContent=text;
  el.style.cssText=`left:${x}px;top:${y-20}px;font-size:${sz}px;color:${col};text-shadow:0 2px 6px rgba(0,0,0,.8)`;
  document.body.appendChild(el);
  setTimeout(()=>el.remove(),1000);
}

// ── Draw background ──
function drawBG(){
  const sky=ctx.createLinearGradient(0,0,0,GY);
  sky.addColorStop(0,'#03050e');sky.addColorStop(1,'#060a14');
  ctx.fillStyle=sky; ctx.fillRect(0,0,W,GY);
  ctx.fillStyle='rgba(255,255,255,.28)';
  for(let i=0;i<90;i++){
    const sx=(i*137.5+7)%W, sy=(i*89.3+3)%(GY-20);
    ctx.beginPath(); ctx.arc(sx,sy,i%4===0?1.3:.6,0,Math.PI*2); ctx.fill();
  }
  ctx.fillStyle='rgba(12,22,50,.5)';
  for(let i=0;i<5;i++){
    const mx=W*i/4.5+30, mh=50+i*13;
    ctx.beginPath(); ctx.moveTo(mx-55,GY); ctx.lineTo(mx,GY-mh); ctx.lineTo(mx+55,GY); ctx.fill();
  }
  const gnd=ctx.createLinearGradient(0,GY,0,GY+50);
  gnd.addColorStop(0,'#231706'); gnd.addColorStop(1,'#080503');
  ctx.fillStyle=gnd; ctx.fillRect(0,GY,W,H-GY+10);
  ctx.strokeStyle='#4a2e0e'; ctx.lineWidth=2;
  ctx.beginPath(); ctx.moveTo(0,GY); ctx.lineTo(W,GY); ctx.stroke();
}

// ── Draw stick figure ──
function drawFig(x,y,w,h,col,flash,mirror,atk,anim){
  ctx.save();
  if(mirror){ctx.scale(-1,1); x=-(x+w);}
  const cx=x+w/2, gy=y+h, c=flash>0?'#fff':col;
  const walk=Math.sin(anim*.12);
  ctx.strokeStyle=c; ctx.lineWidth=2.5; ctx.lineCap='round';
  // Head
  ctx.beginPath(); ctx.arc(cx,y+9,8,0,Math.PI*2);
  ctx.fillStyle=flash>0?'rgba(255,255,255,.2)':`${col}20`; ctx.fill(); ctx.stroke();
  // Body
  ctx.beginPath(); ctx.moveTo(cx,y+17); ctx.lineTo(cx,y+h*.58); ctx.stroke();
  // Legs
  ctx.beginPath(); ctx.moveTo(cx,y+h*.58); ctx.lineTo(cx-9+walk*8,gy); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(cx,y+h*.58); ctx.lineTo(cx+9-walk*8,gy); ctx.stroke();
  // Arms
  if(atk){
    ctx.beginPath(); ctx.moveTo(cx,y+h*.32); ctx.lineTo(cx+22,y+h*.14); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(cx,y+h*.32); ctx.lineTo(cx-10,y+h*.5);  ctx.stroke();
  } else {
    ctx.beginPath(); ctx.moveTo(cx,y+h*.32); ctx.lineTo(cx-11+Math.cos(anim*.12)*5,y+h*.52); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(cx,y+h*.32); ctx.lineTo(cx+11-Math.cos(anim*.12)*5,y+h*.52); ctx.stroke();
  }
  // Weapon
  if(G.equippedWeapon!=='brawl' && !mirror){
    ctx.strokeStyle='#c8c8d8'; ctx.lineWidth=3.5;
    const wx=atk?cx+38:cx+22, wy=atk?y+h*.05:y+h*.28;
    ctx.beginPath(); ctx.moveTo(cx+18,y+h*.3); ctx.lineTo(wx,wy); ctx.stroke();
    ctx.lineWidth=1.5;
    const mx2=(cx+18+wx)/2, my2=(y+h*.3+wy)/2;
    const dx=-(wy-(y+h*.3)), dy=wx-(cx+18), dl=Math.sqrt(dx*dx+dy*dy)||1;
    ctx.beginPath(); ctx.moveTo(mx2+dx/dl*7,my2+dy/dl*7); ctx.lineTo(mx2-dx/dl*7,my2-dy/dl*7); ctx.stroke();
  }
  ctx.restore();
}

function drawEnemy(e){
  if(e.dead){
    ctx.save(); ctx.globalAlpha=Math.max(0,1-e.deathT/25);
    ctx.translate(e.x+e.w/2,e.y+e.h/2); ctx.rotate(e.deathT*.08);
    drawFig(-e.w/2,-e.h/2,e.w,e.h,'#e84040',0,false,false,0);
    ctx.restore(); return;
  }
  drawFig(e.x,e.y,e.w,e.h,'#e84040',e.hitFlash,true,false,e.anim);
  // HP bar
  const bw=64,bh=7,bx=e.x+e.w/2-bw/2,by=e.y-15;
  ctx.fillStyle='rgba(0,0,0,.75)'; ctx.fillRect(bx,by,bw,bh);
  const pct=e.hp/e.hpMax;
  ctx.fillStyle=pct>.5?'#40c040':pct>.25?'#f0c040':'#e84040';
  ctx.fillRect(bx,by,bw*pct,bh);
  ctx.strokeStyle='#333'; ctx.lineWidth=.5; ctx.strokeRect(bx,by,bw,bh);
  // Level label
  const isBossE=(G.level>0&&G.level%20===0);
  ctx.fillStyle=isBossE?'#f0c040':'rgba(255,255,255,.6)'; ctx.font=(isBossE?'bold ':'')+'9px Rajdhani'; ctx.textAlign='center';
  ctx.fillText((isBossE?'⭐':'')+'Lv.'+G.level,e.x+e.w/2,by-2);
  if(isBossE){
    ctx.shadowColor='#f0c040';ctx.shadowBlur=10;
    ctx.strokeStyle='rgba(240,192,64,.4)';ctx.lineWidth=1.5;
    ctx.strokeRect(e.x-4,e.y-4,e.w+8,e.h+8);
    ctx.shadowBlur=0;
  }
}

function doAttack(){
  const s   = computeStats();
  const now = Date.now();
  if(now - lastAtk < s.cd) return;
  lastAtk = now;
  player.atkFrame = 14;

  const e = enemies.find(x=>!x.dead);
  if(!e) return;

  let dmg = s.atk;
  const isCrit = G.guaranteeCrit || Math.random()*100 < s.critRate;
  G.guaranteeCrit = false;
  if(isCrit) dmg = dmg * s.critDmg / 100;
  dmg = Math.floor(dmg);

  e.hp -= dmg; e.hitFlash = 8;
  burst(e.x+e.w/2, e.y+e.h/2, isCrit?'#f0c040':'#ff5544', isCrit?14:8);
  fdmg(e.x+e.w/2, e.y, (isCrit?'💥':'')+dmg, isCrit?'#f0c040':'#fff', isCrit?26:18);

  if(s.lifesteal>0){
    const heal=Math.max(1,Math.floor(dmg*s.lifesteal/100));
    G.hp=Math.min(G.hpMax,G.hp+heal);
  }
  if(e.hp<=0) killEnemy(e);
  else triggerEnemyCounter(e);
}

function triggerEnemyCounter(e){
  if(!e||e.dead) return;
  // Enemy counter-attacks with 25% chance after each player attack
  if(Math.random()<0.25) enemyAtk(e);
}

function doCritSkill(){
  if(!G.unlockedSkills.critSkill) return;
  if(cdEnd.crit > Date.now()) return;
  cdEnd.crit = Date.now() + getSkillCd("crit");

// ── 乱闘系スキル共通チェック ──
function isBrawlEquipped(){
  const w=WEAPONS.find(x=>x.id===G.equippedWeapon)||WEAPONS[0];
  return G.equippedWeapon==='brawl'||w.brawlMode;
}
function isSwordEquipped(){
  const w=WEAPONS.find(x=>x.id===G.equippedWeapon)||WEAPONS[0];
  return G.equippedWeapon!=='brawl'&&!w.brawlMode;
}
function getEnemy(){ return enemies.find(x=>!x.dead)||null; }
function dealDmg(e,dmg,col,icon,sz){
  if(e.dead) return 0;
  const actual=Math.min(dmg, e.hp); // HPを0未満にしない
  e.hp-=actual; e.hitFlash=8;
  burst(e.x+e.w/2,e.y+e.h/2,col,10);
  fdmg(e.x+e.w/2,e.y,(icon||'')+actual,col,sz||20);
  const s=computeStats();
  if(s.lifesteal>0){ G.hp=Math.min(G.hpMax,G.hp+Math.max(1,Math.floor(actual*s.lifesteal/100))); }
  if(e.hp<=0) killEnemy(e);
  return actual;
}

// Enemy milestone: every 20 player levels, enemy gets a power spike
function getEnemyMilestoneMultiplier(lv){
  const tier=Math.floor(lv/20); // +1 tier every 20 levels
  return 1 + tier*0.2; // +20% per tier
}

function killEnemy(e){
  if(e.dead) return;
  e.dead=true; e.hp=0;
  G.kills++; G.coins+=e.coin; G.totalCoinsEarned=(G.totalCoinsEarned||0)+e.coin;
  burst(e.x+e.w/2,e.y+e.h/2,'#f0c040',16);
  fdmg(e.x+e.w/2,e.y-20,'+💰'+e.coin,'#f0c040',14);

  G.xp += e.xp;
  while(G.xp >= G.xpNext && G.level<20000){
    G.xp  -= G.xpNext;
    G.level++;
    const pts = G.level<=100 ? 2 : G.level<=500 ? 5 : 10;
    G.statPoints += pts;
    G.xpNext = Math.floor(10 * Math.pow(1.012, G.level));
    const s=computeStats(); G.hpMax=s.hpMax; G.hp=G.hpMax;
    playLvUpSound();
    if(G.level%10===0) notify('⬆️ Lv.'+G.level+' UP！','#f0c040');
    if(G.level%20===0 && G.level>0) notify('💀 敵が強化された！ (Tier '+Math.floor(G.level/20)+')','#e84040');
  }

  checkQuestProgress();

  if(G.gameMode==='dungeon'){
    G.dungeonWave++;
    if(G.dungeonWave>=5){
      G.dungeonTokens+=3; G.gameMode='play';
      document.getElementById('state-chip').style.display='none';
      notify('🏰 ダンジョンクリア！🏰+3','#f0c040');
      enemies=enemies.filter(x=>!x.dead);spawnEnemy();
    } else {
      document.getElementById('state-chip').textContent='🏰 Wave '+(G.dungeonWave+1)+'/5';
      enemies=enemies.filter(x=>!x.dead);spawnEnemy();
    }
  } else if(G.gameMode==='crystal'){
    G.crystalTokens+=3; G.gameMode='play';
    document.getElementById('state-chip').style.display='none';
    notify('💎 クリスタルクリア！💎+3','#30d0e8');
    enemies=enemies.filter(x=>!x.dead);spawnEnemy();
  } else {
    enemies=enemies.filter(x=>!x.dead);spawnEnemy();
  }

  autoSave();
}

function enemyAtk(e){
  // 鋼体：無効＆カウンター
  if(ironBodyActive){
    ironBodyActive=false;
    notify('🛡️ 鋼体！攻撃を無効化＆カウンター！','#aaaacc');
    const s=computeStats();
    dealDmg(e,Math.floor(s.atk*2),'#aaaacc','🛡️',26);
    return;
  }
  const s=computeStats();
  let d=Math.max(1,Math.floor(e.atk/s.defMul));
  // 怒り装甲：被ダメ80%減
  if(rageActive && Date.now()<rageEnd) d=Math.max(1,Math.floor(d*0.2));
  G.hp=Math.max(0,G.hp-d);
  player.hitFlash=10;
  fdmg(player.x+player.w/2,player.y,'-'+d,'#e84040',16);
  if(G.hp<=0){
    const s2=computeStats(); G.hp=s2.hpMax;
    notify('💀 やられた！','#e84040');
  }
}

// ============================================================
// QUEST SYSTEM
// ============================================================
function checkQuestProgress(){
  let newReady=false;
  for(const q of QUESTS){
    if(G.completedQuests.includes(q.id)) continue;
    if(q.requires && !G.completedQuests.includes(q.requires)) continue;
    const prog=getQuestProgress(q);
    if(prog>=q.target && !isQuestReady(q)){
      if(!G.questProgress[q.id]) G.questProgress[q.id]={ready:false};
      G.questProgress[q.id].ready=true;
      newReady=true;
      notify('📜 クエスト達成！「'+q.name+'」受け取り可能','#f0c040');
    }
  }
  updateQuestBadge();
}

function isQuestReady(q){
  return G.questProgress[q.id]?.ready;
}

function getQuestProgress(q){
  if(q.type==='kill')      return G.kills;
  if(q.type==='level')     return G.level;
  if(q.type==='coinTotal') return G.totalCoinsEarned||0;
  return 0;
}

function claimQuest(qid){
  const q=QUESTS.find(x=>x.id===qid);
  if(!q||G.completedQuests.includes(qid)) return;
  G.completedQuests.push(qid);
  if(G.questProgress[qid]) G.questProgress[qid].ready=false;
  applyReward(q);
  notify('🎉 報酬獲得: '+q.rewardDesc,'#f0c040');
  updateMenuLocks();
  autoSave();
  renderQuests();
}

function applyReward(q){
  const r=q.reward;
  if(r.type==='unlock') G.unlockedMenus[r.what]=true;
  if(r.type==='skill')  G.unlockedSkills[r.what]=true;
  if(r.type==='atkpct') G.atkPercent+=r.amount;
  if(r.type==='weapon'){
    if(!G.inventory.includes(r.what)) G.inventory.push(r.what);
  }
}

function updateQuestBadge(){
  const ready=QUESTS.filter(q=>!G.completedQuests.includes(q.id)&&isQuestReady(q)).length;
  document.getElementById('quest-badge').textContent=ready>0?` 🔴`:'';
}

function updateMenuLocks(){
  const m=G.unlockedMenus;
  document.getElementById('mbtn-upg').classList.toggle('locked',!m.upgrade);
  document.getElementById('mbtn-dng').classList.toggle('locked',!m.dungeon);
  document.getElementById('mbtn-race').classList.toggle('locked',!m.race);

  const brawl=isBrawlEquipped(), sword=isSwordEquipped();

  // 全スキルの定義: [id, unlockedKey, brawlOnly, swordOnly]
  const SKILL_DEFS=[
    {id:'crit',        key:'critSkill',    brawl:true,  sword:false},
    {id:'burst',       key:'burstSkill',   brawl:true,  sword:false},
    {id:'rageSkin',    key:'rageSkin',     brawl:true,  sword:false},
    {id:'ironBody',    key:'ironBody',     brawl:true,  sword:false},
    {id:'dragonPunch', key:'dragonPunch',  brawl:true,  sword:false},
    {id:'soulEat',     key:'soulEat',      brawl:true,  sword:false},
    {id:'blade',       key:'bladeSkill',   brawl:false, sword:true},
    {id:'pierceFang',  key:'pierceFang',   brawl:false, sword:true},
    {id:'whirlwind',   key:'whirlwind',    brawl:false, sword:true},
    {id:'thunderSlash',key:'thunderSlash', brawl:false, sword:true},
    {id:'soulBlade',   key:'soulBlade',    brawl:false, sword:true},
  ];

  for(const def of SKILL_DEFS){
    const btn=document.getElementById('sk-'+def.id);
    if(!btn) continue;
    const unlocked=G.unlockedSkills[def.key];
    // 乱闘装備時のみ乱闘スキル、剣装備時のみ剣スキルを表示
    const visible = (def.brawl&&brawl) || (def.sword&&sword);
    btn.style.display = visible ? 'flex' : 'none';
    btn.classList.toggle('locked', !unlocked);
    const lockTxt=document.getElementById(def.id+'-lock-txt');
    if(lockTxt) lockTxt.style.display=unlocked?'none':'block';
  }
}

// ============================================================
// GAME LOOP
// ============================================================
let lastTs=0;
function loop(ts){
  const dt=ts-lastTs; lastTs=ts;
  update(dt); render();
  requestAnimationFrame(loop);
}

function update(dt){
  player.anim++;
  if(player.hitFlash>0) player.hitFlash--;
  if(player.atkFrame>0) player.atkFrame--;
  player.y=GY-player.h;

  for(const e of enemies){
    if(e.dead){e.deathT++;continue;}
    e.anim++; if(e.hitFlash>0) e.hitFlash--;
    e.y=GY-e.h;
    // enemy attacks handled by triggerEnemyCounter() called from doAttack
  }
  enemies=enemies.filter(e=>!e.dead||e.deathT<28);

  for(const p of particles){p.x+=p.vx;p.y+=p.vy;p.vy+=.12;p.life--;}
  particles=particles.filter(p=>p.life>0);

  updateCDBtns();
  updateHUD();
}

function render(){
  ctx.clearRect(0,0,W,H); drawBG();
  for(const p of particles){
    ctx.save(); ctx.globalAlpha=p.life/p.maxLife;
    ctx.fillStyle=p.color; ctx.beginPath(); ctx.arc(p.x,p.y,p.r*(p.life/p.maxLife),0,Math.PI*2); ctx.fill();
    ctx.restore();
  }
  drawFig(player.x,player.y,player.w,player.h,'#60b8ff',player.hitFlash,false,player.atkFrame>0,player.anim);
  for(const e of enemies) drawEnemy(e);
}

function fmt(n){if(n>=1e9)return(n/1e9).toFixed(1)+'B';if(n>=1e6)return(n/1e6).toFixed(1)+'M';if(n>=1e3)return(n/1e3).toFixed(1)+'K';return n;}

function updateHUD(){
  const s=computeStats();
  G.hpMax=s.hpMax; G.hp=Math.min(G.hp,G.hpMax);
  document.getElementById('hp-bar').style.width=(G.hp/G.hpMax*100)+'%';
  document.getElementById('hp-txt').textContent=G.hp+'/'+G.hpMax;
  document.getElementById('xp-bar').style.width=(G.xp/G.xpNext*100)+'%';
  document.getElementById('xp-txt').textContent=fmt(G.xp)+'/'+fmt(G.xpNext);
  document.getElementById('lv-chip').textContent='Lv.'+G.level;
  document.getElementById('coin-txt').textContent=fmt(G.coins);
  document.getElementById('dt-txt').textContent=G.dungeonTokens;
  document.getElementById('ct-txt').textContent=G.crystalTokens;

function updateCDBtns(){
  const now=Date.now();
  const atkBtn=document.getElementById('sk-attack');
  const s=computeStats();
  const atkRem=lastAtk+s.cd-now;
  if(atkRem>0){
    atkBtn.classList.add('on-cd');
    const el=document.getElementById('cd-attack');
    el.style.display='block'; el.textContent=(atkRem/1000).toFixed(1)+'s';
  } else {
    atkBtn.classList.remove('on-cd');
    document.getElementById('cd-attack').style.display='none';
  }
  for(const k of Object.keys(CDMAP)){
    const btn=document.getElementById('sk-'+k);
    const el=document.getElementById('cd-'+k);
    if(!btn||!el) continue;
    const rem=cdEnd[k]-now;
    if(rem>0){btn.classList.add('on-cd');el.style.display='block';el.textContent=(rem/1000).toFixed(1)+'s';}
    else{btn.classList.remove('on-cd');el.style.display='none';}
  }
}

function addStatInput(type, dir){
  const el=document.getElementById('si-'+type);
  const n=Math.max(1,parseInt(el?.value)||1);
  addStat(type, dir*n);
}

function addStat(type,delta){
  if(type==='hp'){
    if(delta>0){const add=Math.min(delta,G.statPoints);if(add<=0){notify('ポイント不足！','#e84040');return;}G.hpStat+=add;G.statPoints-=add;}
    else{const sub=Math.min(-delta,G.hpStat);G.hpStat-=sub;G.statPoints+=sub;}
    const s=computeStats();G.hpMax=s.hpMax;G.hp=Math.min(G.hp,G.hpMax);
    renderStatus();return;
  }
  if(delta>0){
    const add=Math.min(delta,G.statPoints);
    if(add<=0){notify('ポイント不足！','#e84040');return;}
    G[type+'Stat']+=add; G.statPoints-=add;
  } else {
    const sub=Math.min(-delta,G[type+'Stat']);
    G[type+'Stat']-=sub; G.statPoints+=sub;
  }
  renderStatus();
}

  const md=u.costD-G.dungeonTokens, mc=u.costC-G.crystalTokens;
  if(md>0||mc>0){
    let msg='不足: ';
    if(md>0) msg+=`🏰${md} `;
    if(mc>0) msg+=`💎${mc}`;
    notify(msg,'#e84040'); return;

  G.dungeonTokens-=u.costD; G.crystalTokens-=u.costC; G.upgrades[id]++;
  notify('⬆️ '+u.name+' Lv.'+G.upgrades[id],'#4488ff');
  renderUpgrade(); autoSave();
}

let pendingRace=null;
let multiRollResults=null;

function rollOne(){
  G.gachaPityEpic=(G.gachaPityEpic||0)+1;
  G.gachaPityLegend=(G.gachaPityLegend||0)+1;

  // 天井チェック
  if(G.gachaPityLegend>=100000){
    G.gachaPityLegend=0; G.gachaPityEpic=0;
    const legends=RACES.filter(r=>r.rarity==='LEGEND RARE');
    return legends[Math.floor(Math.random()*legends.length)];
  }
  if(G.gachaPityEpic>=10000){
    G.gachaPityEpic=0;
    const epics=RACES.filter(r=>r.rarity==='EPIC'||r.rarity==='LEGEND RARE');
    return epics[Math.floor(Math.random()*epics.length)];
  }

  const rand=Math.random(); let cum=0;
  for(const r of RACES){cum+=r.prob; if(rand<cum) return r;}
  return RACES[0];
}

function doRaceRoll(times){
  const cost=500*times;
  if(G.coins<cost){notify('💰'+cost.toLocaleString()+'必要！','#e84040');return;}
  G.coins-=cost;

  if(times===1){
    pendingRace=rollOne();
    multiRollResults=null;
    closeModal('race-modal'); showRR(pendingRace);
  } else {
    const results=[];
    for(let i=0;i<times;i++) results.push(rollOne());
    multiRollResults=results;
    pendingRace=null;
    closeModal('race-modal'); showMultiRR(results);
  }
  autoSave();
}

function showMultiRR(results){
  // ベストを自動選択（レアリティ順）
  const order=['LEGEND RARE','EPIC','SUPER RARE','RARE'];
  let best=results[0];
  for(const r of results){
    if(order.indexOf(r.rarity)<order.indexOf(best.rarity)) best=r;
  }

  const counts={};
  for(const r of results) counts[r.rarity]=(counts[r.rarity]||0)+1;

  const rc=RARC[best.rarity];
  const card=document.getElementById('rr-card');
  card.style.borderColor=rc.color;
  card.style.background=`radial-gradient(circle at top,${rc.color}22,#0a0e1e)`;

  document.getElementById('rr-name').style.color=rc.color;
  document.getElementById('rr-name').textContent='×'+results.length+' まとめ結果';
  document.getElementById('rr-rar').style.color=rc.color;
  document.getElementById('rr-rar').textContent=
    Object.entries(counts).map(([rar,n])=>`${rar}×${n}`).join(' / ');

  // 結果一覧表示
  let listHtml='<div style="max-height:200px;overflow-y:auto;margin:8px 0;display:flex;flex-wrap:wrap;gap:5px;justify-content:center">';
  for(const r of results){
    const c=RARC[r.rarity].color;
    listHtml+=`<span style="border:1px solid ${c};color:${c};border-radius:6px;padding:2px 7px;font-size:11px;font-weight:700">${r.name}</span>`;
  }
  listHtml+='</div>';
  document.getElementById('rr-desc').innerHTML=
    `<div style="font-size:12px;color:var(--cyan);margin-bottom:5px">✨ 最高レア: <b style="color:${rc.color}">${best.name}</b>（${best.rarity}）</div>`+
    `<div style="font-size:11px;color:var(--muted);margin-bottom:4px">${best.desc}</div>`+listHtml;

  pendingRace=best;
  const kb=document.getElementById('rr-keep-btn');
  kb.style.background=rc.color; kb.style.color='#000';
  kb.textContent='✓ ベストを装備';
  document.getElementById('race-result').classList.remove('hidden');
}

function showRR(r){
  const rc=RARC[r.rarity];
  const card=document.getElementById('rr-card');
  card.style.borderColor=rc.color; card.style.background=`radial-gradient(circle at top,${rc.color}22,#0a0e1e)`;
  document.getElementById('rr-name').style.color=rc.color; document.getElementById('rr-name').textContent=r.name;
  document.getElementById('rr-rar').style.color=rc.color;  document.getElementById('rr-rar').textContent=r.rarity;
  document.getElementById('rr-desc').textContent=r.desc;
  const kb=document.getElementById('rr-keep-btn'); kb.style.background=rc.color; kb.style.color='#000';
  kb.textContent='✓ 装備する';
  document.getElementById('race-result').classList.remove('hidden');
}
function keepRace(){
  if(!pendingRace) return;
  G.race=pendingRace.id;
  const r=pendingRace, rc=RARC[r.rarity];
  const chip=document.getElementById('race-chip');
  chip.textContent=r.name+' ['+r.rarity+']'; chip.style.color=rc.color; chip.style.borderColor=rc.color; chip.style.background=rc.bg; chip.style.display='block';
  notify('種族「'+r.name+'」装備！',rc.color);
  skipRace(); autoSave();
}

function loadGame(){
  try{
    const data=localStorage.getItem(SAVE_KEY);
    if(!data) return JSON.parse(JSON.stringify(DEFAULT));
    const saved=JSON.parse(data);
    const base=JSON.parse(JSON.stringify(DEFAULT));
    // Deep merge: primitives from saved, objects merged
    const merged={
      ...base,
      level:       saved.level       ?? base.level,
      xp:          saved.xp          ?? base.xp,
      xpNext:      saved.xpNext      ?? base.xpNext,
      hp:          saved.hp          ?? base.hp,
      hpMax:       saved.hpMax       ?? base.hpMax,
      coins:       saved.coins       ?? base.coins,
      kills:       saved.kills       ?? base.kills,
      dungeonTokens:saved.dungeonTokens ?? base.dungeonTokens,
      crystalTokens:saved.crystalTokens ?? base.crystalTokens,
      statPoints:  saved.statPoints  ?? base.statPoints,
      brawlStat:   saved.brawlStat   ?? base.brawlStat,
      swordStat:   saved.swordStat   ?? base.swordStat,
      hpStat:      saved.hpStat      ?? base.hpStat,
      atkPercent:  saved.atkPercent  ?? base.atkPercent,
      equippedWeapon:saved.equippedWeapon ?? base.equippedWeapon,
      inventory:   saved.inventory   ?? base.inventory,
      race:        saved.race        ?? base.race,
      totalCoinsEarned: saved.totalCoinsEarned ?? base.totalCoinsEarned,
      gachaPityEpic:   saved.gachaPityEpic   ?? 0,
      gachaPityLegend: saved.gachaPityLegend ?? 0,
      guaranteeCrit:false,
      gameMode:    'play',
      dungeonWave: 0,
      upgrades:      {...base.upgrades,      ...(saved.upgrades      ||{})},
      unlockedSkills:{...base.unlockedSkills,...(saved.unlockedSkills||{})},
      unlockedMenus: {...base.unlockedMenus,  ...(saved.unlockedMenus ||{})},
      questProgress: {...base.questProgress,  ...(saved.questProgress ||{})},
      completedQuests:saved.completedQuests  || [],
    };
    return merged;
  }catch(e){console.error('loadGame error',e);return JSON.parse(JSON.stringify(DEFAULT));}
}

// ============================================================
// NOTIFY
// ============================================================
function notify(msg,col='#f0c040'){
  const s=document.getElementById('nstack');
  const el=document.createElement('div');
  el.className='nitem'; el.style.color=col; el.style.borderColor=col; el.textContent=msg;
  s.appendChild(el);
  setTimeout(()=>el.remove(),2600);
}

// ============================================================
// INIT
// ============================================================
// レベルに応じた累計ステータスポイントを計算（レベル1からlvまでの合計）
function calcTotalStatPointsForLevel(lv){
  let total=0;
  for(let i=2;i<=lv;i++){
    total += i<=100 ? 2 : i<=500 ? 5 : 10;
  }
  return total;
}

function init(){
  // Load saved data NOW (after all functions defined)
  const loaded = loadGame();
  // Replace all keys properly
  for(const k of Object.keys(loaded)) G[k]=loaded[k];
  // ショップは常に解放
  G.unlockedMenus.shop=true;
  G.unlockedMenus.inventory=true;

  // ── レベルに応じたポイント補填 ──
  // 既に使用したポイント数 = (brawlStat + swordStat + hpStat)
  const usedPoints = (G.brawlStat||0) + (G.swordStat||0) + (G.hpStat||0);
  const totalShouldHave = calcTotalStatPointsForLevel(G.level);
  const expectedFree = totalShouldHave - usedPoints;
  if(expectedFree > G.statPoints){
    const bonus = expectedFree - G.statPoints;
    G.statPoints = expectedFree;
    if(bonus > 0) notify('📦 未受取ポイント +'+bonus+' を補填しました！','#f0c040');
  }

  const s=computeStats(); G.hpMax=s.hpMax; G.hp=Math.min(G.hp,G.hpMax);
  updateMenuLocks();
  updateQuestBadge();
  checkQuestProgress();
  spawnEnemy();
  requestAnimationFrame(loop);
}

init();

// ダブルタップズーム防止
let lastTouchEnd=0;
document.addEventListener('touchend',function(e){
  const now=Date.now();
  if(now-lastTouchEnd<=300){ e.preventDefault(); }
  lastTouchEnd=now;
},{passive:false});
document.addEventListener('touchmove',function(e){
  if(e.touches.length>1) e.preventDefault();
},{passive:false});
</script>
